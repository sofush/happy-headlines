services:
  postgres-comments:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    ports:
      - "5432:5432"
    volumes:
      - ./services/comment-service/comments.sql:/docker-entrypoint-initdb.d/comments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-profanity:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: profanity
      POSTGRES_PASSWORD: profanity
    ports:
      - "5433:5432"
    volumes:
      - ./services/profanity-service/profanity.sql:/docker-entrypoint-initdb.d/profanity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profanity -d profanity"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-subscribers:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subscribers
      POSTGRES_USER: subscribers
      POSTGRES_PASSWORD: subscribers
    ports:
      - "5434:5432"
    volumes:
      - ./services/subscriber-service/subscribers.sql:/docker-entrypoint-initdb.d/subscribers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscribers -d subscribers"]
      interval: 2s
      timeout: 3s
      retries: 15

  profanity-service:
    build: ./services/profanity-service
    ports:
      - "3002:3002"
    depends_on:
      postgres-profanity:
        condition: service_healthy

  subscriber-service:
    build: ./services/subscriber-service
    ports:
      - "3003:3003"
    depends_on:
      postgres-subscribers:
        condition: service_healthy
      redis-subscriber-queue:
        condition: service_started

  newsletter-service:
    build: ./services/newsletter-service
    ports:
      - "3004:3004"
    depends_on:
      subscriber-service:
        condition: service_started

  comment-service:
    build: ./services/comment-service
    ports:
      - "3001:3001"
    depends_on:
      postgres-comments:
        condition: service_healthy
      profanity-service:
        condition: service_started
      redis-cache:
        condition: service_started

  postgres-articles-africa:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_africa
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_africa"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-antarctica:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_antarctica
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_antarctica"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-asia:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_asia
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_asia"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-europe:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_europe
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_europe"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-north-america:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_north_america
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_north_america"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-oceania:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_oceania
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_oceania"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-south-america:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_south_america
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_south_america"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-articles-global:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: articles_global
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: articles
    volumes:
      - ./services/article-service/articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles_global"]
      interval: 2s
      timeout: 3s
      retries: 15

  article-service-1:
    build: ./services/article-service
    environment:
      RUST_LOG: "info,article_service=debug,tower_http=info"
      OTEL_SERVICE_NAME: "article-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
      postgres-articles-africa:
        condition: service_healthy
      postgres-articles-antarctica:
        condition: service_healthy
      postgres-articles-asia:
        condition: service_healthy
      postgres-articles-europe:
        condition: service_healthy
      postgres-articles-north-america:
        condition: service_healthy
      postgres-articles-oceania:
        condition: service_healthy
      postgres-articles-south-america:
        condition: service_healthy
      postgres-articles-global:
        condition: service_healthy
      redis-articles-cache:
        condition: service_started

  article-service-2:
    build: ./services/article-service
    environment:
      RUST_LOG: "info,article_service=debug,tower_http=info"
      OTEL_SERVICE_NAME: "article-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
      postgres-articles-africa:
        condition: service_healthy
      postgres-articles-antarctica:
        condition: service_healthy
      postgres-articles-asia:
        condition: service_healthy
      postgres-articles-europe:
        condition: service_healthy
      postgres-articles-north-america:
        condition: service_healthy
      postgres-articles-oceania:
        condition: service_healthy
      postgres-articles-south-america:
        condition: service_healthy
      postgres-articles-global:
        condition: service_healthy
      redis-articles-cache:
        condition: service_started

  article-service-3:
    build: ./services/article-service
    environment:
      RUST_LOG: "info,article_service=debug,tower_http=info"
      OTEL_SERVICE_NAME: "article-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
      postgres-articles-africa:
        condition: service_healthy
      postgres-articles-antarctica:
        condition: service_healthy
      postgres-articles-asia:
        condition: service_healthy
      postgres-articles-europe:
        condition: service_healthy
      postgres-articles-north-america:
        condition: service_healthy
      postgres-articles-oceania:
        condition: service_healthy
      postgres-articles-south-america:
        condition: service_healthy
      postgres-articles-global:
        condition: service_healthy
      redis-articles-cache:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    environment:
      COLLECTOR_STORAGE_TYPE: memory
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped

  redis-cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--save "" --appendonly no
    restart: unless-stopped

  redis-articles-cache:
    image: redis:alpine
    ports:
      - "6380:6379"
    environment:
      - REDIS_ARGS=--save "" --appendonly no
    restart: unless-stopped

  redis-subscriber-queue:
    image: redis:alpine
    ports:
      - "6381:6379"
    environment:
      - REDIS_ARGS=--save "" --appendonly no
    restart: unless-stopped

  loadbalancer:
    image: nginx:1.30-alpine
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
      - comment-service
