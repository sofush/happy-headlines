name: Build and publish images

on:
  push:
    tags:
      - release
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version/tag (for example v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - article-service
          - comment-service
          - profanity-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image prefix
        id: image
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "value=${INPUT_VERSION:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
