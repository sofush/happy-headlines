[package]
name = "article-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
redis = { version = "1.7.1", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
